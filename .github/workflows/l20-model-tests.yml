name: L20 model tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  cpu-tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      # The original repository contains an unregistered CSDF gitlink.
      # Initialize only the model dependency managed by this workflow.
      - name: Check out the pinned official model
        run: git submodule update --init --recursive -- third_party/linkerhand-urdf
      - uses: actions/setup-python@v7
        with:
          python-version: '3.8'
          cache: pip
          cache-dependency-path: requirements-l20.txt
      - name: Install CPU test dependencies
        run: |
          python -m pip install -r requirements-l20.txt
          python -m pip install 'torch==1.13.1+cpu' --index-url https://download.pytorch.org/whl/cpu
      - name: Verify the source and derived model assets
        run: python -m l20.prepare
      - name: Run the model and policy-interface tests
        run: python -m pytest -q
      - name: Check that preparation left the submodule unchanged
        run: test -z "$(git -C third_party/linkerhand-urdf status --porcelain)"
